# ============================================================================
# OmniWM installer configuration — "niri scrolling tiling" preset
# ============================================================================
#
# Declarative config consumed by ./install. Values are KEY=value pairs that map
# 1:1 to the {{TOKENS}} in templates/settings.toml. Precedence at install time:
#
#     CLI flags  >  this file (--config)  >  interactive prompts  >  built-in
#
# Edit a value, save, then re-run:  ./install --skip-install --force
#
# Booleans: true|false.  Strings with special characters stay unquoted unless
# they contain a leading/trailing space (the quotes are stripped on read).
# ============================================================================


# --- general ---------------------------------------------------------------
# Layout used by workspaces whose own layoutType is "default".
# "niri" (scrolling containers) or "dwindle" (BSP).
GENERAL_DEFAULT_LAYOUT_TYPE=niri

# Animate layout changes (macOS Reduce Motion overrides this anyway).
GENERAL_ANIMATIONS_ENABLED=true

# The modifier set "Hyper" expands to. At least two of Control/Option/Shift/Command.
GENERAL_HYPER_KEY_MODIFIERS=Control+Option+Shift+Command

# Physical trigger that acts as Hyper while held: None, CapsLock, F13-F20, or a
# side modifier. "None" unless you remap Hyper elsewhere (e.g. Karabiner).
GENERAL_SYSTEM_HYPER_TRIGGER=None

# Enable the IPC server used by omniwmctl.
GENERAL_IPC_ENABLED=false


# --- niri (scrolling) layout ----------------------------------------------
# How many columns share the viewport side by side.
NIRI_VISIBLE_CONTAINER_COUNT=2

# Treat the column strip as a loop instead of a bounded row.
NIRI_INFINITE_LOOP=false

# When to center the focused column: never | always | onOverflow.
NIRI_CENTER_FOCUSED_COLUMN=onOverflow

# Center the column when a workspace holds only one.
NIRI_ALWAYS_CENTER_SINGLE_COLUMN=true

# Size of a lone window: fill | container_primary_span | WIDTHxHEIGHT.
NIRI_SINGLE_WINDOW_FIT=fill

# Primary-axis span fraction for new containers (0.0-1.0).
NIRI_DEFAULT_CONTAINER_PRIMARY_SPAN=0.5

# Keep the inner gap between columns and the screen edges.
NIRI_EDGE_GAPS=true

# Increment (percentage points) for Niri grow/shrink actions (1-100).
NIRI_RESIZE_STEP_PERCENT=5


# --- gaps ------------------------------------------------------------------
# Inner gap between tiled windows, in points.
GAPS_SIZE=16.0

# Outer gaps at each screen edge, in points.
GAPS_OUTER_LEFT=0.0
GAPS_OUTER_RIGHT=0.0
GAPS_OUTER_TOP=0.0
GAPS_OUTER_BOTTOM=0.0


# --- borders ---------------------------------------------------------------
# Draw the focused-window border.
BORDER_ENABLED=true

# Border width in points (clamped 1-12 at runtime).
BORDER_WIDTH=5.0

# Active (focused) border color #2b303cd4 -> RGBA floats 0.0-1.0.
BORDER_COLOR_RED=0.1686
BORDER_COLOR_GREEN=0.1882
BORDER_COLOR_BLUE=0.2353
BORDER_COLOR_ALPHA=0.8314

# Inactive border color #2b303cd6 (alpha 0.8392) is intentionally NOT wired up:
# OmniWM draws a border only on the focused window and has no inactive-border
# key yet. Kept here as a comment for when the schema grows one.
# BORDER_INACTIVE_COLOR=#2b303cd6


# --- gestures (the "scrolling" feel) ---------------------------------------
# Trackpad column-scrolling and modifier + wheel scrolling along the Niri axis.
GESTURES_SCROLL_ENABLED=true

# Trackpad column-scroll finger count: 2 | 3 | 4.
GESTURES_FINGER_COUNT=3

# Snap to columns ("snap") or inertial ("momentum").
GESTURES_TRACKPAD_SCROLL_STYLE=snap

# Invert the trackpad scroll direction.
GESTURES_INVERT_DIRECTION=true

# Scroll gesture sensitivity.
GESTURES_SCROLL_SENSITIVITY=5.0

# Modifier for mouse-wheel scrolling: optionShift | controlShift.
GESTURES_SCROLL_MODIFIER_KEY=optionShift


# --- multi-monitor / display arrangement ------------------------------------
# Routing mode: macOS (follow the system display arrangement) | custom (use the
# generated horizontal side-by-side grid below).
ARRANGE_MODE=macOS

# When ARRANGE_MODE=custom and more than one display is connected, the installer
# lays displays out in a single horizontal row (left -> right).
# ARRANGE_LAYOUT is fixed to "horizontal" for now.
# ARRANGE_ORDER=auto            # or a comma-separated left->right display list

# Cursor warping between monitors (only relevant with routing.mode = "custom").
MOUSE_WARP_ENABLED=true

# Directional focus continues onto the neighboring monitor at the screen edge.
FOCUS_CROSSES_MONITOR_AT_EDGE=false


# --- integration -------------------------------------------------------------
# (Not stored in settings.toml — used by lib/integrate.sh.)
START_AT_LOGIN=false
